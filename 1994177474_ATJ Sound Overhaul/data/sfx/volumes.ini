# Edit reverb effect parameters here
# The headings must start with "ReverbParameters", use e.g. ReverbParameters1, ReverbParameters2, ...
# Reverb effects are only created at startup. If you want a different number of effects you need to restart the game
# The parameter values of existing effects can be reloaded at runtime by pressing F11

# For explanations of the parameters see https://usermanual.wiki/Pdf/Effects20Extension20Guide.90272296/view
# Section "Standard Reverb" page 101
# Important: the values must lie in the ranges defined there!
# Errors are printed to the log

# special parameter: avorionMinActivationDistanceMeters: the distance at which these parameters will start to be used

# lowpass filtering comes in two flavours:
# direct filter: applied directly to the sound
# reverb filter: applied to the reverb effect
# for explanations see AL_LOWPASS_GAIN and AL_LOWPASS_GAINHF in the document above

[ReverbParameters1]
avorionMinActivationDistanceMeters = 500
directLowpassGain = 1
directLowpassGainHF = 1
reverbLowpassGain = 1
reverbLowpassGainHF = 1

density = 1.0
diffusion = 1.0
gain = 0.32
gainHF = 0.32
decayTime = 0.5
decayHFRatio = 0.83
reflectionsGain = 0.05
reflectionsDelay = 0.007
lateReverbGain = 1.26
lateReverbDelay = 0.011
roomRolloffFactor = 0.1
airAbsorptionGainHF = 0.994
decayHFLimit = true

